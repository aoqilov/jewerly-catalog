openapi: 3.0.0
paths:
  /api/v1/auth/buyer/verifications/{verification_id}:
    get:
      description: "Опрос фронтендом в сценарии Telegram: ждём, пока бот пришлёт код
        (status: code_sent)."
      operationId: VerificationsPublicController_status
      parameters:
        - name: verification_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponseDto"
        "404":
          description: VERIFICATION_NOT_FOUND
      summary: Статус подтверждения
      tags: &a1
        - auth / buyer verifications
  /api/v1/auth/buyer/verifications/{verification_id}/resend:
    post:
      description: Пауза между отправками 60 секунд, не больше 3 повторов на сессию.
      operationId: VerificationsPublicController_resend
      parameters:
        - name: verification_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponseDto"
        "404":
          description: VERIFICATION_NOT_FOUND
        "409":
          description: TELEGRAM_NOT_LINKED_YET
        "429":
          description: RESEND_TOO_EARLY, OTP_RATE_LIMITED (Retry-After)
        "503":
          description: SMS_DELIVERY_FAILED
      summary: Отправить код ещё раз
      tags: *a1
  /api/v1/auth/buyer/verifications/{verification_id}/verify:
    post:
      description: Верный код удаляет сессию и выдаёт одноразовый verification_token
        на 15 минут для registration/complete или password-reset/complete.
      operationId: VerificationsPublicController_verify
      parameters:
        - name: verification_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationTokenResponseDto"
        "404":
          description: VERIFICATION_NOT_FOUND
        "409":
          description: TELEGRAM_NOT_LINKED_YET
        "410":
          description: OTP_ATTEMPTS_EXCEEDED
        "422":
          description: INVALID_OTP_CODE (details.attempts_left)
      summary: Проверить код
      tags: *a1
  /api/v1/auth/buyer/login:
    post:
      description: Не больше 5 неудач на пару (роль, логин, IP) и 30 на IP за 15
        минут. Блокировка проверяется после пароля.
      operationId: BuyerAuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseDto"
        "400":
          description: VALIDATION_ERROR
        "401":
          description: INVALID_CREDENTIALS
        "403":
          description: ACCOUNT_BLOCKED
        "429":
          description: TOO_MANY_LOGIN_ATTEMPTS (Retry-After)
      summary: Вход (buyer)
      tags: &a2
        - auth / buyer
  /api/v1/auth/buyer/refresh:
    post:
      description: Новая пара токенов; старый refresh-токен больше не действует.
      operationId: BuyerAuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseDto"
        "401":
          description: TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
        "403":
          description: ACCOUNT_BLOCKED
      summary: Обновление токенов (buyer)
      tags: *a2
  /api/v1/auth/buyer/logout:
    post:
      description: "all_sessions: true завершает все сессии учётки, иначе только текущую."
      operationId: BuyerAuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutDto"
      responses:
        "204":
          description: Сессия завершена
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
      security:
        - buyer_bearer: []
      summary: Выход (buyer)
      tags: *a2
  /api/v1/auth/buyer/change-password:
    post:
      description: Сбрасывает must_change_password; после коммита завершаются все
        сессии, кроме текущей.
      operationId: BuyerAuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDto"
      responses:
        "204":
          description: Пароль изменён
        "400":
          description: VALIDATION_ERROR
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
        "422":
          description: INVALID_CURRENT_PASSWORD, PASSWORD_SAME_AS_CURRENT
      security:
        - buyer_bearer: []
      summary: Смена пароля (buyer)
      tags: *a2
  /api/v1/auth/buyer/password-reset/start:
    post:
      description: Номер должен быть зарегистрирован и не заблокирован. Код приходит
        по SMS или через Telegram-бот.
      operationId: BuyerPasswordResetController_start
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartVerificationDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponseDto"
        "403":
          description: ACCOUNT_BLOCKED
        "404":
          description: PHONE_NOT_REGISTERED
        "422":
          description: PHONE_NOT_ALLOWED, CHANNEL_NOT_AVAILABLE
        "429":
          description: OTP_RATE_LIMITED
        "503":
          description: SMS_DELIVERY_FAILED
      summary: Начать восстановление пароля
      tags: &a3
        - auth / buyer password reset
  /api/v1/auth/buyer/password-reset/complete:
    post:
      description: Все прежние сессии покупателя завершаются, выдаётся новая пара токенов.
      operationId: BuyerPasswordResetController_complete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseDto"
        "403":
          description: ACCOUNT_BLOCKED
        "404":
          description: PHONE_NOT_REGISTERED
        "422":
          description: VERIFICATION_TOKEN_INVALID
      summary: Задать новый пароль по токену подтверждения
      tags: *a3
  /api/v1/public/stores:
    get:
      description: "Активные магазины для витрины: карточки с id, названием, описанием
        и баннером. Отключённых магазинов в списке нет; Поиск search по
        названию. Постранично: page и page_size. Сортировка: created_at, name.
        Полные данные магазина (контакты, адреса) отдаёт GET
        /public/stores/{store_id}."
      operationId: StoresPublicController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: search
          required: false
          in: query
          description: Поиск по названию
          schema:
            example: zara
            type: string
        - name: sort
          required: false
          in: query
          description: "Сортировка: created_at, name"
          schema:
            example: created_at:desc
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStoreListResponseDto"
      summary: Активные магазины
      tags: &a4
        - public / stores
  /api/v1/public/stores/{store_id}:
    get:
      description: Только видимые соцсети и услуги, всё по position, затем id.
        Счётчики каталога — в /public/stores/{id}/catalog-filters.
      operationId: StoresPublicController_get
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStoreDetailResponseDto"
        "404":
          description: STORE_NOT_FOUND (и для неактивного)
      summary: Магазин с адресами, контактами, соцсетями и услугами
      tags: *a4
  /api/v1/public/products:
    get:
      description: "Только видимые товары: active, магазин активен, категория и
        подкатегория видны."
      operationId: ProductsPublicController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: tag_ids
          required: false
          in: query
          description: Теги через запятую
          schema:
            type: array
            items:
              type: string
        - name: material_ids
          required: false
          in: query
          description: Материалы через запятую
          schema:
            type: array
            items:
              type: string
        - name: color_ids
          required: false
          in: query
          description: Цвета через запятую
          schema:
            type: array
            items:
              type: string
        - name: sizes
          required: false
          in: query
          description: Есть хотя бы один из размеров
          schema:
            type: array
            items:
              type: string
        - name: search
          required: false
          in: query
          description: Поиск по названию и бренду
          schema:
            example: платье
            type: string
        - name: price_sale_min
          required: false
          in: query
          schema:
            example: "1000"
            type: string
        - name: price_sale_max
          required: false
          in: query
          schema:
            example: "20000"
            type: string
        - name: price_rental_min
          required: false
          in: query
          schema:
            example: "1000"
            type: string
        - name: price_rental_max
          required: false
          in: query
          schema:
            example: "20000"
            type: string
        - name: is_sellable
          required: false
          in: query
          schema:
            example: true
            type: boolean
        - name: is_rentable
          required: false
          in: query
          schema:
            example: true
            type: boolean
        - name: is_tailorable
          required: false
          in: query
          schema:
            example: false
            type: boolean
        - name: sort
          required: false
          in: query
          description: "Сортировка: created_at, name, price_sale, price_rental,
            views_count, favorites_count"
          schema:
            example: created_at:desc
            type: string
        - name: store_id
          required: false
          in: query
          description: Магазин
          schema:
            example: 7
            type: number
        - name: category_id
          required: false
          in: query
          description: Категория
          schema:
            example: 3
            type: number
        - name: subcategory_id
          required: false
          in: query
          description: Подкатегория
          schema:
            example: 12
            type: number
        - name: has_discount
          required: false
          in: query
          description: Есть активная скидка
          schema:
            example: true
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCardListResponseDto"
      summary: Товары витрины
      tags: &a5
        - public / products
  /api/v1/public/products/slug/{slug}:
    get:
      description: С токеном покупателя засчитывается просмотр.
      operationId: ProductsPublicController_bySlug
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: PRODUCT_NOT_FOUND
      security:
        - buyer_bearer: []
      summary: Товар по slug
      tags: *a5
  /api/v1/public/products/{product_id}:
    get:
      description: С токеном покупателя засчитывается просмотр.
      operationId: ProductsPublicController_byId
      parameters:
        - name: product_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: PRODUCT_NOT_FOUND
      security:
        - buyer_bearer: []
      summary: Товар
      tags: *a5
  /api/v1/public/stores/{store_id}/categories:
    get:
      description: products_count — только видимые товары.
      operationId: StoreCatalogPublicController_categories
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCategoryNodeDto"
        "404":
          description: STORE_NOT_FOUND
      summary: Дерево видимых категорий магазина
      tags: &a6
        - public / store catalog
  /api/v1/public/stores/{store_id}/categories/{category_id}:
    get:
      description: Одна видимая категория магазина. Для категории верхнего уровня в
        children приходят её видимые подкатегории, для подкатегории children
        пустой. products_count считает только видимые товары. Скрытая или чужая
        категория — 404 CATEGORY_NOT_FOUND, неактивный магазин — 404
        STORE_NOT_FOUND.
      operationId: StoreCatalogPublicController_category
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
        - name: category_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCategoryNodeDto"
        "404":
          description: STORE_NOT_FOUND, CATEGORY_NOT_FOUND
      summary: Видимая категория с подкатегориями
      tags: *a6
  /api/v1/public/stores/{store_id}/catalog-filters:
    get:
      description: Только значения видимых товаров. Кэш 5 минут, сбрасывается при
        изменении каталога.
      operationId: StoreCatalogPublicController_filters
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFiltersResponseDto"
        "404":
          description: STORE_NOT_FOUND
      summary: Фильтры и сводка каталога магазина
      tags: *a6
  /api/v1/auth/buyer/registration/start:
    post:
      description: Код по SMS или ссылка на Telegram-бот. Зарегистрированный номер —
        409 до отправки кода.
      operationId: RegistrationPublicController_start
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartVerificationDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponseDto"
        "409":
          description: PHONE_ALREADY_REGISTERED
        "422":
          description: PHONE_NOT_ALLOWED, CHANNEL_NOT_AVAILABLE
        "429":
          description: OTP_RATE_LIMITED
        "503":
          description: SMS_DELIVERY_FAILED
      summary: Начать регистрацию покупателя
      tags: &a7
        - auth / buyer registration
  /api/v1/auth/buyer/registration/complete:
    post:
      description: "Ответ как у входа: покупатель сразу авторизован."
      operationId: RegistrationPublicController_complete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseDto"
        "409":
          description: PHONE_ALREADY_REGISTERED
        "422":
          description: VERIFICATION_TOKEN_INVALID
      summary: Создать покупателя по токену подтверждения
      tags: *a7
  /api/v1/buyer/me:
    get:
      description: "Профиль текущего покупателя: телефон, ФИО, пол, возраст, город,
        Telegram, аватар. Телефон изменить нельзя."
      operationId: BuyerMeBuyerController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponseDto"
        "401": &a8
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
      security: &a9
        - buyer_bearer: []
      summary: Профиль покупателя
      tags: &a10
        - buyer / me
    patch:
      description: Только JSON; аватар — отдельным ресурсом.
      operationId: BuyerMeBuyerController_update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponseDto"
        "401": *a8
      security: *a9
      summary: Изменить профиль
      tags: *a10
  /api/v1/buyer/me/avatar:
    put:
      description: Квадратная копия 500×500.
      operationId: BuyerMeBuyerController_replaceAvatar
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP или HEIC
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponseDto"
        "401": *a8
        "413":
          description: FILE_TOO_LARGE
        "415":
          description: UNSUPPORTED_IMAGE_FORMAT
        "422":
          description: IMAGE_DIMENSIONS_OUT_OF_RANGE
      security: *a9
      summary: Заменить аватар
      tags: *a10
    delete:
      description: Убирает аватар и возвращает обновлённый профиль. Если аватара не
        было, ответ тот же.
      operationId: BuyerMeBuyerController_removeAvatar
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerMeResponseDto"
        "401": *a8
      security: *a9
      summary: Удалить аватар
      tags: *a10
  /api/v1/buyer/favorites/products:
    get:
      description: "Скрытые и снятые с публикации товары остаются с is_available: false."
      operationId: FavoritesBuyerController_products
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: sort
          required: false
          in: query
          description: "Сортировка: favorited_at"
          schema:
            example: favorited_at:desc
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteProductListResponseDto"
        "401": &a11
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
      security: &a12
        - buyer_bearer: []
      summary: Избранные товары
      tags: &a13
        - buyer / favorites
  /api/v1/buyer/favorites/products/ids:
    get:
      description: Для «сердечек» в списках витрины.
      operationId: FavoritesBuyerController_productIds
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteProductIdsDto"
        "401": *a11
      security: *a12
      summary: id избранных товаров (до 1000)
      tags: *a13
  /api/v1/buyer/favorites/products/{product_id}:
    put:
      description: Идемпотентно.
      operationId: FavoritesBuyerController_addProduct
      parameters:
        - name: product_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "204":
          description: В избранном
        "401": *a11
        "404":
          description: PRODUCT_NOT_FOUND
      security: *a12
      summary: Добавить товар в избранное
      tags: *a13
    delete:
      description: 204, даже если товара там не было.
      operationId: FavoritesBuyerController_removeProduct
      parameters:
        - name: product_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "204":
          description: Убран
        "401": *a11
      security: *a12
      summary: Убрать товар из избранного
      tags: *a13
  /api/v1/buyer/favorites/stores:
    get:
      description: "Избранные магазины покупателя, новые сверху. Постранично: page и
        page_size. Сортировка: favorited_at. Магазин, который стал недоступен
        (отключён), остаётся в списке с is_available=false, чтобы фронт показал
        его неактивным."
      operationId: FavoritesBuyerController_stores
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: sort
          required: false
          in: query
          description: "Сортировка: favorited_at"
          schema:
            example: favorited_at:desc
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStoreListResponseDto"
        "401": *a11
      security: *a12
      summary: Избранные магазины
      tags: *a13
  /api/v1/buyer/favorites/stores/ids:
    get:
      description: Только id избранных магазинов (до 1000). Нужен, чтобы отметить
        «сердечки» в списках магазинов без загрузки полных карточек.
      operationId: FavoritesBuyerController_storeIds
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStoreIdsDto"
        "401": *a11
      security: *a12
      summary: id избранных магазинов
      tags: *a13
  /api/v1/buyer/favorites/stores/{store_id}:
    put:
      description: "Добавляет магазин в избранное. Повторный вызов безопасен: магазин
        не задваивается. Несуществующий магазин — 404 STORE_NOT_FOUND."
      operationId: FavoritesBuyerController_addStore
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "204":
          description: В избранном
        "401": *a11
        "404":
          description: STORE_NOT_FOUND
      security: *a12
      summary: Добавить магазин в избранное
      tags: *a13
    delete:
      description: Убирает магазин из избранного. Если его там не было, ответ тот же (204).
      operationId: FavoritesBuyerController_removeStore
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "204":
          description: Убран
        "401": *a11
      security: *a12
      summary: Убрать магазин из избранного
      tags: *a13
  /api/v1/public/news:
    get:
      description: "Магазин активен, status = active, now внутри периода показа. В
        списке products_count вместо products, а вместо галереи только постер
        (poster_image) и баннер (banner_image): фото галереи приходят в карточке
        новости."
      operationId: NewsPublicController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: store_id
          required: false
          in: query
          schema:
            example: 7
            type: number
        - name: types
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: starts_at, created_at
          schema:
            example: starts_at:desc
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNewsListResponseDto"
      summary: Активные новости
      tags: &a14
        - public / news
  /api/v1/public/news/{news_id}:
    get:
      description: "Опубликованная новость: HTML очищен, у товаров показаны карточки
        только видимых товаров. Кроме постера и баннера приходят фото галереи
        (images) по возрастанию position, только готовые. Черновик, ещё не
        начавшаяся или уже закончившаяся новость — 404 NEWS_NOT_FOUND."
      operationId: NewsPublicController_get
      parameters:
        - name: news_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNewsResponseDto"
        "404":
          description: NEWS_NOT_FOUND (и для неопубликованной)
      summary: Новость с карточками видимых товаров
      tags: *a14
  /api/v1/public/stores/{store_id}/news/slug/{slug}:
    get:
      description: "Та же новость, но по slug внутри магазина: удобно для
        человекочитаемых адресов страниц. Условия видимости те же, иначе 404
        NEWS_NOT_FOUND."
      operationId: NewsPublicController_bySlug
      parameters:
        - name: store_id
          required: true
          in: path
          schema:
            type: number
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNewsResponseDto"
        "404":
          description: NEWS_NOT_FOUND
      summary: Новость магазина по slug
      tags: *a14
  /api/v1/buyer/orders:
    post:
      description: >-
        Создаёт заказ в одном магазине: все позиции `items` должны быть товарами
        магазина `store_id`. Цены и данные товаров фиксируются снимком на момент
        оформления. Новый заказ получает статус `pending_confirmation`.


        **Защита от двойного заказа.** Передавайте заголовок `Idempotency-Key`
        (подробно — в описании параметра). Тогда повтор запроса после обрыва
        сети или таймаута не создаст второй заказ: сервер вернёт уже созданный с
        кодом **200** вместо **201**. Различайте 200 и 201, только если это
        нужно для аналитики; для интерфейса оба ответа означают «заказ
        оформлен».


        **Ошибки:**


        - `400 VALIDATION_ERROR` — тело не прошло проверку или `Idempotency-Key`
        не UUID (`details.errors`).

        - `409 IDEMPOTENCY_KEY_CONFLICT` — ключ уже использован с другим телом
        запроса.

        - `409 RESOURCE_BUSY` — конфликт блокировок при параллельных операциях;
        повторите запрос с тем же ключом.

        - `422 DUPLICATE_ORDER_ITEM` — одинаковые позиции (товар, размер, тип
        цены) нужно объединить, `details.indexes` — их индексы в `items`.

        - `422 STORE_NOT_AVAILABLE` — магазин не найден или деактивирован.

        - `422 PRODUCTS_NOT_AVAILABLE` — товары не найдены, сняты с витрины или
        из другого магазина, `details.product_ids`.

        - `422 PRICE_TYPE_NOT_AVAILABLE` — этот тип цены у товара выключен,
        `details.product_id`, `details.price_type`.

        - `422 SIZE_REQUIRED`, `SIZE_NOT_AVAILABLE` — размер не выбран или его
        нет, `details.available_sizes`.

        - `422 SIZE_NOT_APPLICABLE` — у товара нет размеров, передайте `size:
        null`.
      operationId: OrdersBuyerController_create
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            Ключ идемпотентности: UUID, который фронтенд генерирует сам
            (`crypto.randomUUID()`), по одному на каждое оформление заказа.
            Необязателен, но без него повторный запрос создаст второй заказ.


            **Как пользоваться:**


            1. Сгенерируйте ключ, когда покупатель начинает оформление (открыл
            экран подтверждения), и храните его, пока заказ не оформлен.

            2. Если ответа нет (обрыв сети, таймаут, 5xx, `409 RESOURCE_BUSY`),
            повторите запрос **с тем же ключом и тем же телом**. Порядок
            элементов `items` тоже должен совпадать.

            3. После успешного ответа (201 или 200) ключ больше не используйте.
            Для следующего заказа, а также после изменения корзины, комментария
            или магазина сгенерируйте новый ключ.


            **Что ответит сервер:**


            - Ключ новый — заказ создаётся, **201**.

            - Заказ с этим ключом уже есть и тело совпадает — новый заказ не
            создаётся, возвращается существующий, **200**. Заказ приходит в
            текущем состоянии: его статус мог уже измениться.

            - Заказ с этим ключом уже есть, а тело другое (`store_id`,
            `buyer_comment`, позиции или их порядок) — **409
            `IDEMPOTENCY_KEY_CONFLICT`**. Значит, ключ переиспользован для
            другого заказа: сгенерируйте новый.

            - Значение не UUID — **400 `VALIDATION_ERROR`**.

            - Два одновременных запроса с одним ключом (двойное нажатие) создают
            один заказ: оба получат его.


            Ключ занимается только успешно созданным заказом. Если запрос
            завершился ошибкой (400, 422), заказа нет и ключ свободен: после
            исправления данных можно отправить запрос с тем же ключом. Ключи
            разных покупателей не пересекаются и не имеют срока действия.
          required: false
          schema:
            type: string
            format: uuid
            example: 3f2b8c1e-5d4a-4c7b-9e2f-1a6d8b0c4e57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      responses:
        "200":
          description: "Повтор с тем же Idempotency-Key и тем же телом: возвращён ранее
            созданный заказ, новый не создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "401": &a15
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_EXPIRED, SESSION_NOT_ACTIVE
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT — ключ уже использован с другим телом;
            RESOURCE_BUSY — повторите с тем же ключом
        "422":
          description: DUPLICATE_ORDER_ITEM, STORE_NOT_AVAILABLE, PRODUCTS_NOT_AVAILABLE,
            PRICE_TYPE_NOT_AVAILABLE, SIZE_REQUIRED, SIZE_NOT_AVAILABLE,
            SIZE_NOT_APPLICABLE
      security: &a16
        - buyer_bearer: []
      summary: Оформить заказ
      tags: &a17
        - buyer / orders
    get:
      description: "Заказы текущего покупателя. Фильтры: statuses, store_id, даты.
        Постранично: page и page_size. В строке списка есть первая позиция
        (first_item) и allowed_actions: список допустимых действий (для
        покупателя это cancel, пока заказ ждёт подтверждения)."
      operationId: OrdersBuyerController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Номер страницы
          schema:
            default: 1
            example: 1
            type: number
        - name: page_size
          required: false
          in: query
          description: Размер страницы
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: number
        - name: statuses
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: created_from
          required: false
          in: query
          schema:
            example: 2026-10-01
            type: string
        - name: created_to
          required: false
          in: query
          schema:
            example: 2026-10-31
            type: string
        - name: store_id
          required: false
          in: query
          schema:
            example: 7
            type: number
        - name: sort
          required: false
          in: query
          schema:
            example: created_at:desc
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponseDto"
        "401": *a15
      security: *a16
      summary: Мои заказы
      tags: *a17
  /api/v1/buyer/orders/{order_id}:
    get:
      description: Полный заказ покупателя с позициями и историей статусов. Позиции
        хранят снимок товара и цены на момент оформления, поэтому не меняются
        при правках каталога. Чужой заказ — 404 ORDER_NOT_FOUND.
      operationId: OrdersBuyerController_get
      parameters:
        - name: order_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "401": *a15
        "404":
          description: ORDER_NOT_FOUND
      security: *a16
      summary: Заказ
      tags: *a17
  /api/v1/buyer/orders/{order_id}/cancel:
    post:
      description: Только из pending_confirmation и только причины покупателя.
      operationId: OrdersBuyerController_cancel
      parameters:
        - name: order_id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "401": *a15
        "404":
          description: ORDER_NOT_FOUND
        "409":
          description: ORDER_STATUS_TRANSITION_NOT_ALLOWED (details.current_status,
            requested_status, allowed_statuses), ORDER_STATUS_CHANGED
        "422":
          description: CANCELLATION_REASON_NOT_ALLOWED
      security: *a16
      summary: Отменить заказ
      tags: *a17
info:
  title: Birid API — buyer
  description: Бэкенд маркетплейса одежды Birid
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    buyer_bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    VerificationResponseDto:
      type: object
      properties:
        verification_id:
          type: string
          description: Идентификатор подтверждения
          example: 1f0c6b2e-7a8d-4c1e-9b3f-5d2a6e8c4f10
        channel:
          type: string
          description: Канал
          enum:
            - sms
            - telegram
          example: telegram
        status:
          type: string
          description: Статус
          enum:
            - awaiting_telegram
            - code_sent
            - verified
          example: awaiting_telegram
        phone:
          type: string
          description: Номер в E.164
          example: "+998901234567"
        telegram_link:
          type: string
          description: Ссылка на Telegram-бота (только канал telegram)
          example: https://t.me/birid_bot?start=v_Qm9dX2...
          nullable: true
        expires_in:
          type: number
          description: Сколько секунд осталось до истечения сессии
          example: 600
        resend_available_in:
          type: number
          description: Через сколько секунд можно запросить код повторно
          example: 60
      required:
        - verification_id
        - channel
        - status
        - phone
        - telegram_link
        - expires_in
        - resend_available_in
    VerifyCodeDto:
      type: object
      properties:
        code:
          type: string
          description: Код из SMS или от Telegram-бота
          example: "123456"
      required:
        - code
    VerificationTokenResponseDto:
      type: object
      properties:
        verification_token:
          type: string
          description: Одноразовый токен для шага завершения
          example: vt_8Yh3...
        purpose:
          type: string
          description: Цель подтверждения
          enum:
            - buyer_registration
            - buyer_password_reset
          example: buyer_registration
        phone:
          type: string
          description: Подтверждённый номер
          example: "+998901234567"
        expires_in:
          type: number
          description: Срок токена в секундах
          example: 900
      required:
        - verification_token
        - purpose
        - phone
        - expires_in
    LoginDto:
      type: object
      properties:
        login:
          type: string
          description: Логин (у покупателя — номер телефона в любом формате)
          example: zara_admin
        password:
          type: string
          description: Пароль
          example: S3cret-pass
      required:
        - login
        - password
    TokenAccountDto:
      type: object
      properties:
        id:
          type: number
          description: Идентификатор учётки
          example: 42
        role:
          type: string
          description: Роль
          enum:
            - admin
            - seller
            - buyer
          example: seller
        login:
          type: string
          description: Логин
          example: zara_admin
        must_change_password:
          type: boolean
          description: Нужно сменить пароль при входе
          example: false
      required:
        - id
        - role
        - login
        - must_change_password
    TokenPairResponseDto:
      type: object
      properties:
        access_token:
          type: string
          description: "Access-токен: передаётся в заголовке Authorization: Bearer
            <токен>. Срок жизни зашит в токен (поле exp)"
          example: eyJhbGciOiJSUzI1NiIs...
        refresh_token:
          type: string
          description: "Refresh-токен: меняется на новую пару через POST
            /auth/{role}/refresh; одноразовый"
          example: eyJhbGciOiJSUzI1NiIs...
        account:
          description: Учётная запись, для которой выпущены токены
          allOf:
            - $ref: "#/components/schemas/TokenAccountDto"
      required:
        - access_token
        - refresh_token
        - account
    RefreshDto:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh-токен из ответа входа
          example: eyJhbGciOiJSUzI1NiIs...
      required:
        - refresh_token
    LogoutDto:
      type: object
      properties:
        all_sessions:
          type: boolean
          description: true — завершить все сессии учётки, иначе только текущую
          example: false
          default: false
    ChangePasswordDto:
      type: object
      properties:
        current_password:
          type: string
          description: Текущий пароль
          example: S3cret-pass
        new_password:
          type: string
          description: "Новый пароль: 8–128 символов, хотя бы одна буква и одна цифра"
          example: N3w-secret-pass
      required:
        - current_password
        - new_password
    StartVerificationDto:
      type: object
      properties:
        phone:
          type: string
          description: Номер телефона в любом формате, который разбирает libphonenumber-js
          example: +998 90 123 45 67
        channel:
          type: string
          description: Канал доставки кода
          enum:
            - sms
            - telegram
          example: telegram
      required:
        - phone
        - channel
    CompletePasswordResetDto:
      type: object
      properties:
        verification_token:
          type: string
          description: Токен из verify
          example: vt_8Yh3...
        new_password:
          type: string
          description: "Новый пароль: 8–128 символов, хотя бы одна буква и одна цифра"
          example: N3w-secret-pass
      required:
        - verification_token
        - new_password
    OriginalResponseDto:
      type: object
      properties:
        url:
          type: string
          description: Публичный URL оригинала без метаданных (EXIF, GPS, XMP)
          example: https://files.birid.uz/media-renditions/2b7d9f40-1c3e-4a58-9e6d-7f0a1b2c3d4e
        width:
          type: number
          description: Ширина, px
          example: 3024
        height:
          type: number
          description: Высота, px
          example: 4032
      required:
        - url
        - width
        - height
    RenditionResponseDto:
      type: object
      properties:
        url:
          type: string
          description: Публичный URL WebP-копии
          example: https://files.birid.uz/media-renditions/6f1c4a2e-9d0b-4c47-8a11-2f6b7e0c91e2
        width:
          type: number
          description: Ширина, px
          example: 810
        height:
          type: number
          description: Высота, px
          example: 1080
      required:
        - url
        - width
        - height
    RenditionsResponseDto:
      type: object
      properties:
        large:
          $ref: "#/components/schemas/RenditionResponseDto"
        medium:
          $ref: "#/components/schemas/RenditionResponseDto"
        small:
          $ref: "#/components/schemas/RenditionResponseDto"
        square:
          description: Обложка категории и аватар
          allOf:
            - $ref: "#/components/schemas/RenditionResponseDto"
    ImageResponseDto:
      type: object
      properties:
        id:
          type: number
          description: Идентификатор
          example: 81
        status:
          type: string
          description: Статус обработки; копии есть только у ready
          enum: &a20
            - pending
            - processing
            - ready
            - failed
          example: ready
        original_filename:
          type: string
          description: Имя файла от клиента
          example: IMG_2041.HEIC
        width:
          type: number
          description: Ширина оригинала с учётом поворота
          example: 3024
          nullable: true
        height:
          type: number
          description: Высота оригинала с учётом поворота
          example: 4032
          nullable: true
        original:
          nullable: true
          description: Оригинал в исходном размере и формате (HEIC — в JPEG) без
            метаданных; null, пока изображение не ready
          type: object
          allOf:
            - $ref: "#/components/schemas/OriginalResponseDto"
        renditions:
